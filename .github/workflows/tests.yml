name: Backend Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Run API tests
        working-directory: backend
        run: python -m pytest -q tests

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbe
          POSTGRES_USER: orbe
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbe -d orbe"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://orbe:local-ci-only@localhost:5432/orbe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - name: Upgrade, rollback and reapply PostgreSQL migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current
          alembic downgrade base
          alembic upgrade head
          python -c "from sqlalchemy import create_engine,inspect; import os; e=create_engine(os.environ['DATABASE_URL']); print(inspect(e).get_table_names()); assert 'usuarios' in inspect(e).get_table_names()"
