services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbe
      POSTGRES_USER: orbe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - orbe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbe -d orbe"]
      interval: 5s
      retries: 15
  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://orbe:${POSTGRES_PASSWORD}@db:5432/orbe
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY}
      BOOTSTRAP_ENTIDADE_CODIGO: ${BOOTSTRAP_ENTIDADE_CODIGO:?Configure código}
      BOOTSTRAP_ENTIDADE_NOME: ${BOOTSTRAP_ENTIDADE_NOME:?Configure nome}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Configure e-mail}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Configure senha}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
volumes:
  orbe_pgdata:
